name: Download BUZZ POWER CARLMPAIGN

on:
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Install SteamCMD
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y lib32gcc-s1 curl zip

          mkdir -p "$HOME/steamcmd"

          curl -L \
            https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            -o /tmp/steamcmd.tar.gz

          tar -xzf /tmp/steamcmd.tar.gz -C "$HOME/steamcmd"

      - name: Download BUZZ POWER
        run: |
          "$HOME/steamcmd/steamcmd.sh" \
            +login anonymous \
            +workshop_download_item 274170 2943701886 \
            +quit | tee "$GITHUB_WORKSPACE/steamcmd.log"

      - name: Search for CARLMPAIGN
        run: |
          echo "=== Searching for Workshop ID 2943701886 ==="

          find "$HOME" \
            -type d \
            -name "2943701886" \
            -print 2>/dev/null || true

          echo "=== Workshop files ==="

          find "$HOME" \
            -path "*workshop*" \
            -type f \
            -print 2>/dev/null | head -300 || true

      - name: Make ZIP
        run: |
          MOD="$(find "$HOME" \
            -type d \
            -name "2943701886" \
            -print \
            -quit 2>/dev/null)"

          if [ -z "$MOD" ]; then
            echo "CARLMPAIGN folder was NOT found."
            echo "SteamCMD log:"
            cat "$GITHUB_WORKSPACE/steamcmd.log"
            exit 1
          fi

          echo "FOUND MOD:"
          echo "$MOD"

          echo "FILES:"
          find "$MOD" -type f -print

          cd "$MOD"

          zip -r \
            "$GITHUB_WORKSPACE/BUZZ_POWER_CARLMPAIGN.zip" \
            .

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: BUZZ-POWER-CARLMPAIGN
          path: BUZZ_POWER_CARLMPAIGN.zip

      - name: Upload SteamCMD log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SteamCMD-log
          path: steamcmd.log
